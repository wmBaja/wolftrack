[project]
name = "wolftrack-visualizer"
version = "1.1.0"
description = "Python backend for the Wolftrack Dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asammdf>=8.7.2",
    "cantools>=41.3.0",
    "fastapi>=0.135.2",
    "openpyxl>=3.1.5",
    "pyinstaller>=6.10.0",
    "python-can>=4.6.1",
    "python-dotenv>=1.2.2",
    "python-multipart",
    "pyzmq>=27.1.0",
    "tornado>=6.1",
    "uvicorn>=0.42.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.ruff.lint]
# Start with syntax and runtime correctness checks; expand after legacy lint findings are cleaned up.
select = ["E4", "E7", "E9"]
